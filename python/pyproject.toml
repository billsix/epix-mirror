[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "epix"
version = "1.2.22"
description = "Python front-end for ePiX — build/figures for LaTeX, with inline notebook display"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
# Phase 1 has no runtime deps: render shells out to the installed `elaps`/`gs`
# toolchain (baked into the container image). Phase 2 adds the nanobind
# extension module (built via meson-python) so figures are built in-process.
dependencies = []

[project.optional-dependencies]
# percent-format notebooks (jupytext) + inline display
notebooks = ["jupytext", "ipython"]
# the interactive JupyterLab environment to run them
jupyter = ["jupyterlab", "jupytext", "ipython"]

[tool.setuptools.packages.find]
where = ["."]
include = ["epix*"]

# Python lint + formatting (ruff) for the package and the percent-format
# notebooks. `format.sh`/`make format` point ruff at this file explicitly
# (`--config python/pyproject.toml`) so it also covers notebooks/ at the repo root.
[tool.ruff]
line-length = 88
# tasks/ is prose: ruff >= 0.14 formats Python code blocks inside Markdown, and the
# task docs' annotated examples (aligned trailing comments) must not be reflowed.
extend-exclude = ["build", "output", "tasks"]

[tool.ruff.lint]
# The shared cross-project tier (runClaudeInContainer
# tasks/reference/python-coding-standard.md). E231/E302 are deliberately absent:
# they are preview-only rules that did nothing but warn, and `ruff format` covers
# both (spacing after a comma, blank lines around defs).
select = [
    "F401", "F811", "E402", "I001", "TID252", "F841",
    "B006", "B007", "B008", "UP007",
    "UP035", "S311", "S602", "T201",
    "E", "F", "I", "N",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# The notebooks are byte-identical ports of samples/*.xp and keep the C++ sample's
# function and variable names (the plotted `F`, `Phi`, `P_n`, ...) so a reader can
# line each one up with its oracle; the names never reach the rendered eepic.
# Casing rules only -- argument order, imports, and everything else stay enforced.
"notebooks/*.py" = ["N802", "N803", "N806", "N816"]
# verify_ports.py is a command-line gate whose PASS/FAIL lines ARE its output.
"build-aux/*.py" = ["T201"]
