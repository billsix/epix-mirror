[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "epix"
version = "1.2.22"
description = "Python front-end for ePiX — build/figures for LaTeX, with inline notebook display"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
# Phase 1 has no runtime deps: render shells out to the installed `elaps`/`gs`
# toolchain (baked into the container image). Phase 2 adds the nanobind
# extension module (built via meson-python) so figures are built in-process.
dependencies = []

[project.optional-dependencies]
# percent-format notebooks (jupytext) + inline display
notebooks = ["jupytext", "ipython"]
# the interactive JupyterLab environment to run them
jupyter = ["jupyterlab", "jupytext", "ipython"]

[tool.setuptools.packages.find]
where = ["."]
include = ["epix*"]

# Python lint + formatting (ruff) for the package and the percent-format
# notebooks. `format.sh`/`make format` point ruff at this file explicitly
# (`--config python/pyproject.toml`) so it also covers notebooks/ at the repo root.
[tool.ruff]
line-length = 88
extend-exclude = ["build", "output"]

[tool.ruff.lint]
select = [
    "F401", "F811", "E402", "I001", "TID252", "F841",
    "E302", "E231", "B006", "B007", "B008", "UP007",
    "UP035", "S311", "S602", "T201",
    "E", "F", "I",
]
ignore = []
